<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Formulaire - bean.jsp</title><style>body{font-family:Segoe UI,Arial,sans-serif;max-width:820px;margin:24px auto;padding:0 16px;color:#1f2933}h1{color:#1d4ed8;border-bottom:2px solid #dbe4ff;padding-bottom:6px}h2{color:#334155}label{display:block;margin:8px 0}input[type=text]{padding:4px}input[type=submit],button{margin-top:8px;padding:6px 14px}table{border-collapse:collapse;margin:12px 0}th,td{border:1px solid #cbd5e1;padding:6px 12px;text-align:left}th{background:#eef2ff}fieldset{border:1px solid #cbd5e1;padding:12px}li{margin:3px 0}</style></head>
<body>
<h1>2.2 Formulaire (POST vers bean.jsp)</h1>
<form action="bean.jsp" method="POST">
    <label>First name : <input type="text" name="firstName" required></label>
    <label>Last name : <input type="text" name="lastName" required></label>
    <label>Birth date : <input type="text" name="birthDay" placeholder="mm/dd/yyyy" pattern="\d{2}/\d{2}/\d{4}" title="mm/dd/yyyy" required></label>
    <fieldset><legend>Sex</legend>
      <label><input type="radio" name="sex" value="Male" required> Male</label>
      <label><input type="radio" name="sex" value="Female"> Female</label>
    </fieldset>
    <input type="submit" value="Send">
</form>
<p><a href="index.html">&larr; Accueil</a></p>
</body>
</html>
